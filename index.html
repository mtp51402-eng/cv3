<style>
html.locked body > *:not(#gate):not(script):not(style):not(title):not(meta):not(link) { display: none !important; }
#gate { display: none; }
html.locked #gate { position: fixed; inset: 0; z-index: 2147483000; display: flex; align-items: center; justify-content: center; padding: 24px; background: #E9F3FF; color: #1B2A4A; font-family: "Noto Sans Malayalam", system-ui, sans-serif; }
#gate form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
#gate h1 { margin: 0; font-size: 1.5rem; }
#gate p { margin: 0; color: #4A5B80; font-size: 0.95rem; }
#gate input { min-height: 52px; border: 1.5px solid #B8CBEA; border-radius: 14px; padding: 0 14px; font-size: 1.1rem; text-align: center; background: #fff; color: #1B2A4A; font-family: inherit; }
#gate button { min-height: 52px; border: 0; border-radius: 14px; background: #1668D9; color: #fff; font-size: 1.05rem; font-weight: 700; font-family: inherit; }
#gate .err { color: #B42318; min-height: 1.3em; font-weight: 600; }
</style>
<div id="gate">
  <form id="gateForm" autocomplete="off">
    <h1>അറബി അക്ഷര പുസ്തകം</h1>
    <p>പ്രവേശന കോഡ് നൽകുക</p>
    <input id="gateCode" type="password" autocomplete="off" aria-label="Access code">
    <div class="err" id="gateErr" role="alert"></div>
    <button type="submit">തുറക്കുക</button>
  </form>
</div>
<script>
// ACCESS CODE: change the text between the quotes to set a new code. Everyone uses the same one.
// (This keeps casual visitors out. It is not strong security, because the code sits inside this file.)
(function () {
  var CODE = '';   // empty = no access code. To turn the code on again, put a code between the quotes, e.g. 'madrasa2026'.
  var KEY = 'arabicLetters.access';
  if (!CODE) return;
  var ok = false;
  try { ok = localStorage.getItem(KEY) === CODE; } catch (e) { ok = false; }
  var root = document.documentElement;
  if (ok) return;
  root.classList.add('locked');
  document.getElementById('gateForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('gateCode').value.trim();
    if (v === CODE) {
      try { localStorage.setItem(KEY, CODE); } catch (err) { /* ignore */ }
      root.classList.remove('locked');
      window.dispatchEvent(new Event('resize'));
    } else {
      document.getElementById('gateErr').textContent = 'കോഡ് ശരിയല്ല';
      document.getElementById('gateCode').value = '';
    }
  });
})();
</script>

<title>അറബി അക്ഷര പുസ്തകം</title>

<style>
/* Layout: title and 1-or-2 letter switch, scrolling letter strip, a ruled notebook page that turns by hand, pager below. */
:root {
  --bg: #E9F3FF;
  --ink: #1B2A4A;
  --muted: #566892;
  --surface: #FFFFFF;
  --line: #C3D6F2;
  --yellow: #FFD23F;
  --on-yellow: #1B2A4A;
  --mark: #E0312B;
  --hl: #1668D9;
  --paper: #FFFDF8;
  --paper-ink: #1B2A4A;
  --paper-line: #C9DCF6;
  --paper-margin: #F2A7A0;
  --font-ar: "Scheherazade New", "Noto Naskh Arabic", "Amiri", "Geeza Pro", "Traditional Arabic", serif;
  --font-disp: "Baloo Chettan 2", "Noto Sans Malayalam", system-ui, sans-serif;
  --font-body: "Noto Sans Malayalam", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1A33;
    --ink: #EAF1FF;
    --muted: #A5B7DA;
    --surface: #1B2A4A;
    --line: #2E4272;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1A33;
  --ink: #EAF1FF;
  --muted: #A5B7DA;
  --surface: #1B2A4A;
  --line: #2E4272;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.4;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }

.shell {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-inline: max(14px, env(safe-area-inset-left, 0px)) max(14px, env(safe-area-inset-right, 0px));
  padding-block: 10px 10px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.top h1 { margin: 0; font-family: var(--font-disp); font-size: 1.35rem; font-weight: 700; line-height: 1.2; }
.mode { display: flex; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.mode button { flex: 1 1 0; border: 0; background: transparent; border-radius: 999px; padding: 6px 6px; font-weight: 600; font-size: 0.9rem; color: var(--muted); white-space: nowrap; }
.mode button[aria-pressed="true"] { background: var(--yellow); color: var(--on-yellow); }

.strip {
  display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px;
  -webkit-overflow-scrolling: touch; scrollbar-width: thin;
}
.k {
  position: relative; flex: 0 0 auto; width: 54px; height: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; padding: 0;
}
.kc { font-family: var(--font-ar); font-size: 34px; line-height: 1.25; }
.kn { font-size: 10px; color: var(--muted); line-height: 1; margin-top: -2px; }
.k[aria-pressed="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
.k[aria-pressed="true"] .kn { color: var(--on-yellow); }
.k[data-o]::after {
  content: attr(data-o); position: absolute; top: -6px; right: -4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--hl); color: #fff; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center;
}
.tip { margin: 0; font-size: 0.88rem; color: var(--muted); }

.stage { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.pagebar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; }
.pageno { font-weight: 600; color: var(--muted); font-size: 0.95rem; }
.speak {
  width: 56px; height: 56px; border-radius: 50%;
  border: 0; background: var(--hl); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 3px 0 rgba(0,0,0,0.18);
}
.speak:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.18); }
.speak.on { animation: pulse 0.9s ease-in-out infinite; }
.speak[hidden] { display: none; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(22,104,217,0.5); } 50% { box-shadow: 0 0 0 12px rgba(22,104,217,0); } }

.book {
  position: relative; flex: 1 1 auto; min-height: 260px;
  perspective: 1500px; touch-action: none; user-select: none; -webkit-user-select: none;
  overflow: hidden; border-radius: 18px; border: 1.5px solid var(--line); background: var(--paper);
}
.leaf { position: absolute; inset: 0; }
.flip { transform-origin: left center; transform-style: preserve-3d; will-change: transform; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.paper {
  background-color: var(--paper);
  background-image:
    linear-gradient(to right, transparent 0 34px, var(--paper-margin) 34px 35.5px, transparent 35.5px),
    repeating-linear-gradient(to bottom, transparent 0 55px, var(--paper-line) 55px 56px);
}
.face.back { transform: rotateY(180deg); background: #EFE9DA; }
.face.back::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(135deg, rgba(0,0,0,0.03) 0 6px, transparent 6px 12px); }
.shade { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: linear-gradient(90deg, rgba(20,24,40,0.05), rgba(20,24,40,0.55)); }
.face.back .shade { background: linear-gradient(270deg, rgba(20,24,40,0.05), rgba(20,24,40,0.5)); }
.under .shade { background: rgba(20,24,40,1); }

.pg {
  position: absolute; inset: 0; color: var(--paper-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 14px 16px 14px 44px; text-align: center;
}
.tags { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
.chip { background: var(--yellow); color: var(--on-yellow); border-radius: 999px; padding: 3px 14px; font-weight: 700; font-size: 0.95rem; }
.sub { font-family: var(--font-ar); font-size: 1.3rem; color: var(--muted); line-height: 1.6; direction: rtl; }
.ar {
  font-family: var(--font-ar); font-size: var(--fs, 160px); line-height: 1.6;
  direction: rtl; unicode-bidi: isolate; white-space: nowrap; color: var(--paper-ink); font-weight: 400;
}
.mkbig { font-family: var(--font-ar); font-size: 46px; line-height: 1.5; color: var(--mark); font-weight: 700; direction: rtl; }
.hl { color: var(--hl); }
.mean { font-family: var(--font-disp); font-weight: 700; font-size: clamp(24px, 7vw, 34px); line-height: 1.2; }
.snd { font-family: var(--font-disp); font-weight: 700; font-size: clamp(34px, 11vw, 52px); line-height: 1.15; color: var(--hl); }
.lab { font-size: 0.78rem; color: #566892; }
.nm { font-size: 0.9rem; color: #566892; }
.pg.info .arrow { font-size: 54px; line-height: 1; color: var(--hl); }
.pg.info .bigtxt { margin: 0; font-family: var(--font-disp); font-weight: 700; font-size: clamp(26px, 8vw, 36px); line-height: 1.2; }
.pg.info .small { margin: 0; color: #566892; max-width: 24ch; }

.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; }
.pbtn { width: 52px; height: 52px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 26px; line-height: 1; display: grid; place-items: center; }
.pbtn:disabled { opacity: 0.35; }
.mid { flex: 1; text-align: center; font-size: 0.82rem; color: var(--muted); }
.dots { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; margin-bottom: 3px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block; }
.dots i.on { background: var(--hl); }

#toast { position: fixed; left: 50%; transform: translateX(-50%); top: calc(10px + env(safe-area-inset-top, 0px)); z-index: 30; max-width: min(92vw, 440px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 0.9rem; text-align: center; pointer-events: none; }
/* name written faintly in the page margin, reading from bottom to top */
.k[data-done="1"]::before { content: "★"; position: absolute; top: -5px; left: -3px; font-size: 16px; line-height: 1; color: #F59E0B; }

/* writing practice */
.prac { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; border-radius: 18px; border: 1.5px solid var(--line); color: var(--paper-ink); }
.pracin { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 12px 16px 44px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.lv { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; width: 100%; }
.pill { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--paper-line); background: #fff; color: var(--paper-ink); font-weight: 700; }
.pill[aria-current="true"] { background: var(--yellow); border-color: var(--yellow); color: var(--on-yellow); }
.pill:disabled { opacity: 0.4; }
.stars { display: inline-flex; gap: 4px; margin-left: 6px; }
.stars i { width: 20px; height: 20px; background: var(--paper-line); clip-path: polygon(50% 0, 62% 35%, 98% 35%, 69% 57%, 80% 92%, 50% 71%, 20% 92%, 31% 57%, 2% 35%, 38% 35%); display: block; }
.stars i.on { background: #F5B301; }
.pmt { font-weight: 600; font-size: 0.92rem; text-align: center; max-width: 34ch; }
.sndrow { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: center; gap: 2px 10px; min-height: 40px; }
.sndml { font-family: var(--font-disp); font-weight: 700; font-size: 36px; line-height: 1.1; color: var(--hl); }
.sndlab { font-size: 0.78rem; color: #566892; flex-basis: 100%; text-align: center; }
.padarea { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.pad { position: relative; background: #fff; border: 2px solid var(--paper-line); border-radius: 16px; overflow: hidden; touch-action: none; flex: 0 0 auto; }
.pad.ok { border-color: #1E9E5A; box-shadow: 0 0 0 4px rgba(30, 158, 90, 0.22); }
.pad.bad { border-color: var(--mark); box-shadow: 0 0 0 4px rgba(224, 49, 43, 0.18); }
.pc { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.mdl { font-family: var(--font-ar); font-size: 64px; line-height: 1.6; direction: rtl; color: var(--paper-ink); }
.mmeta { font-weight: 600; margin-top: -8px; }
.plusrow { display: flex; direction: rtl; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; font-family: var(--font-ar); font-size: 40px; line-height: 1.5; color: var(--paper-ink); }
.plusrow .pl { font-family: system-ui, sans-serif; font-size: 22px; color: var(--mark); font-weight: 700; }

.boxes { display: grid; direction: rtl; gap: 8px; justify-content: center; }

.rc.ok { background: #E6F7EE; border-color: #1E9E5A; color: #14532D; }

    setTimeout(function () { if (P === mine) { P.busy = false; beginLevel(P.level); } }, 2600);
  }

  /* level 4: write the whole word joined; the letters are shown with + between them */
  function startJoined() {
    var pool = WORDS.filter(function (w) {
      if (/[ةىءؤئّٓ]/.test(w[0])) return false;
      var n = baseLetters(w[0]).length;
      return n >= 3 && n <= 5;
    });
    var withL = shuffle(pool.filter(function (w) { return baseLetters(w[0]).indexOf(P.L[0]) >= 0; }));
    var rest = shuffle(pool.filter(function (w) { return baseLetters(w[0]).indexOf(P.L[0]) < 0; }));
    P.words = withL.concat(rest).slice(0, 3);
    P.wi = 0;
    buildJoined();
  }
  function buildJoined() {
    var w = P.words[P.wi], letters = baseLetters(w[0]);
    var area = $('#padarea'); area.textContent = '';
    $('#sndrow').textContent = '';
    var plus = el('div', 'plusrow'); plus.setAttribute('lang', 'ar'); plus.setAttribute('dir', 'rtl');
    letters.forEach(function (l, i) {
      if (i) plus.appendChild(el('span', 'pl', '+'));
      plus.appendChild(el('span', 'lt', l));
    });
    area.appendChild(plus);
    area.appendChild(el('div', 'mmeta', w[1] + ' · ' + w[2]));
    var total = Math.floor(PIN_.clientWidth) - 56, pw = Math.max(240, Math.min(360, total)), ph = Math.round(pw * 0.52);
    var pad = makePad(pw, ph);
    P.pad = pad;
    P.round = { fails: 0, tpl: makeTpl(letters.join(''), pw, ph, 0.8), rival: makeTpl(letters.join(' '), pw, ph, 0.8) };
    area.appendChild(pad.wrap);
    P.speakText = w[0]; speak(w[0]);
    renderHead(); updateBtns();
  }
  function checkJoined() {
    var mine = P, pad = P.pad, r = P.round;
    if (!pad.strokes.length) { setFb('no', WHY.empty); return; }
    var res = judgeForm(r.tpl, [r.rival], pad.strokes);
    if (res.why === 'form') { pad.wrap.className = 'pad bad'; failLevel('അക്ഷരങ്ങൾ ഒറ്റ രൂപത്തിലാണ് എഴുതിയത്, ചേർത്തെഴുതേണ്ട രൂപത്തിലല്ല. ഈ ലെവൽ വീണ്ടും തുടങ്ങാം.'); return; }
    P.busy = true;
    if (res.ok) {
      pad.locked = true; pad.wrap.className = 'pad ok';
      P.rec.push({ ok: true, t: P.words[P.wi][0] }); P.wi++;
      setFb('ok', 'ശരിയായി!'); renderHead(); renderRec();
      setTimeout(function () { if (P !== mine) return; P.busy = false; if (P.wi >= 3) finishAll(); else { setFb('', ''); buildJoined(); } }, 1100);
    } else {
      r.fails++; pad.wrap.className = 'pad bad';
      P.rec.push({ ok: false, t: P.words[P.wi][0] });
      setFb('no', WHY[res.why] || 'ഒന്നുകൂടി ശ്രമിക്കൂ.'); renderRec();
      if (r.fails >= 2) pad.outline(r.tpl);
      setTimeout(function () { if (P !== mine) return; P.busy = false; if (P.pad === pad) { pad.clear(); pad.wrap.className = 'pad'; } updateBtns(); }, 900);
    }
    updateBtns();
  }

  function finishAll() {
    var c = P.L[0];
    done[c] = 1; saveDone();
    Array.prototype.forEach.call(strip.children, function (b) { if (b.getAttribute('data-c') === c) b.setAttribute('data-done', '1'); });
    $('#winLetter').textContent = c + ' — ' + P.L[2];
    $('#win').hidden = false;
    speak('مَبْرُوك');
  }

  $('#clr').addEventListener('click', function () {
    if (!P || P.busy) return;
    if (P.level === 3) P.boxes.forEach(function (b) { if (!b.done) { b.clear(); b.wrap.className = 'pad'; } });
    else { P.pad.clear(); P.pad.wrap.className = 'pad'; }
    setFb('', ''); updateBtns();
  });
  $('#chk').addEventListener('click', check);
  $('#help').addEventListener('click', function () {
    if (!P || P.busy) return;
    if ((P.level === 2 || P.level === 4) && P.round) {
      P.pad.outline(P.round.tpl);
      var mine = P, pad = P.pad;
      setTimeout(function () { if (P === mine && P.pad === pad && P.round.fails < 2) pad.outline(null); }, 2500);
    } else if (P.level === 3) {
      P.boxes.forEach(function (b) { if (!b.done) b.outline(b.tpl); });
    }
  });
  $('#skip').addEventListener('click', function () { if (P && !P.busy && P.level < 3) { newRound(); renderHead(); } });
  $('#winAgain').addEventListener('click', function () { $('#win').hidden = true; startPractice(P.L[0]); });
  $('#winNext').addEventListener('click', function () {
    var i = 0;
    for (; i < LET.length; i++) if (LET[i][0] === P.L[0]) break;
    S.sel = [LET[(i + 1) % LET.length][0]];
    refresh();
  });
  $('#winBook').addEventListener('click', function () { S.mode = 1; S.sel = S.sel.slice(0, 1); refresh(); });
  window.__ar = { rivalsOf: rivalsOf, judgeForm: judgeForm, WORDS: WORDS, baseLetters: baseLetters, getP: function () { return P; }, makeTpl: makeTpl, judge: judge, formsOf: formsOf, arabicFor: arabicFor, letterOf: letterOf, NN: NN };

  /* ---------- start ---------- */
  var lastW = window.innerWidth;
  window.addEventListener('resize', function () {
    if (S.mode === 3) { if (Math.abs(window.innerWidth - lastW) > 30) { lastW = window.innerWidth; refresh(); } return; }
    lastW = window.innerWidth;
    if (!anim) paint();
  });
  refresh();
})();
</script>

if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
